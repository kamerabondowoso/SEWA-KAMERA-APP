        .native-text { color: #10b981; font-weight: 800; letter-spacing: 2px; font-size: 14px; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        // Helper untuk mengecek apakah suatu item adalah kamera seri 6D
        const isCamera6D = (itemName) => {
            if (!itemName) return false;
            // Mengecek apakah string mengandung '6D' dan tidak sensitif terhadap huruf besar/kecil
            return itemName.toUpperCase().includes("6D");
        };

        const getItemPrice = (itemName, hours, hasCamera, activePricing, dynamicPackages) => {
            // Cek apakah item adalah paket dinamis (mencari berdasarkan gabungan category dan name)
            const dynamicItem = dynamicPackages.find(p => `${p.category} - ${p.name}` === itemName);
            if (dynamicItem) return dynamicItem.price;

            const pricing = activePricing[itemName];
            if (!pricing) return 0;
            if (pricing.flat !== undefined) return pricing.flat;

            if (hours <= 0) return 0;
            let total = 0;
            let h = Math.ceil(hours);
            
            if (h > 24) {
                const days = Math.floor(h / 24);
                total += days * pricing[24];
                h = h % 24;
            }
            if (h > 0) {
                if (h <= 4) total += pricing[4];
                else if (h <= 6) total += pricing[6];
                else if (h <= 12) total += pricing[12];
                else total += pricing[24];
            }
            
            const isFixOrTele = itemName.toLowerCase().includes("fix") || itemName.toLowerCase().includes("tele");
            if (isFixOrTele && hasCamera && hours >= 24) {
                total = Math.max(0, total - 10000);
            }
            return total;

            const duration = (new Date(`${booking.endDate}T${booking.endTime}`) - new Date(`${booking.startDate}T${booking.startTime}`)) / (1000 * 60 * 60);
            if (duration <= 0) return 0;

            const equips = Array.isArray(booking.equipment) ? booking.equipment : [booking.equipment];
            const hasCamera = equips.some(item => EQUIPMENT_CATEGORIES["Kamera"].includes(item));
            const has6D = equips.some(isCamera6D);
            const selectedPromoLenses = equips.filter(e => e.includes("Lensa Fix STM 50mm f1.8 Canon") || e.includes("Lensa Tele Canon 75-300mm USM"));
            
            const rawTotal = equips.reduce((sum, item) => {
                let price = getItemPrice(item, duration, hasCamera, activePricing, dynamicPackages);
                const isPromoLens = item.includes("Lensa Fix STM 50mm f1.8 Canon") || item.includes("Lensa Tele Canon 75-300mm USM");
                if (has6D && isPromoLens && selectedPromoLenses[0] === item) {

                }
                return sum + price;
            }, 0);

            const autoDiscountAmount = isThreeDaysOrMore ? rawTotal * 0.10 : 0;
            const customDiscountAmount = Number(booking.discount || 0);
            
            return Math.max(0, rawTotal - autoDiscountAmount - customDiscountAmount);

            const processFetchedData = (parsedData) => {
                let activeCustomPrices = { ...DEFAULT_PRICING };
                let activeDynamicPackages = INITIAL_DYNAMIC_PACKAGES;
                let activeDynamicEquipment = { ...EQUIPMENT_CATEGORIES };
                const settings = parsedData.find(b => b.id === 'APP_SETTINGS');
                let hasMissingPrices = false;
                
                if (settings) {
                    if (settings.totalMemoryCards !== undefined) setTotalMemory(settings.totalMemoryCards);
                    if (settings.isHolidayMode !== undefined) setIsHolidayMode(settings.isHolidayMode);
                    if (settings.dynamicPackages !== undefined) activeDynamicPackages = settings.dynamicPackages;
                    if (settings.dynamicEquipment !== undefined) activeDynamicEquipment = settings.dynamicEquipment;
                    
                    if (settings.holidays !== undefined) {
                        const now = new Date();
                        const curHourStr = now.getHours().toString().padStart(2, '0');
                        const curMinStr = now.getMinutes().toString().padStart(2, '0');
                        const currentTimeStr = `${curHourStr}:${curMinStr}`;
                        
                        const validHolidays = settings.holidays.filter(h => {
                            if (h.type === 'day') return true; 
                            if (h.date > todayDateStr) return true; 
                            if (h.date === todayDateStr && h.end >= currentTimeStr) return true; 
                            return false; 
                        });
                        setHolidays(validHolidays);
                        if (validHolidays.length !== settings.holidays.length) {
                            settings.holidays = validHolidays;
                            hasMissingPrices = true; 
                        }
                    }
                    
                    // FIXED LOGIC: Completely merge settings.customPricing to capture new/deleted items
                    if (settings.customPricing) {
                        activeCustomPrices = { ...DEFAULT_PRICING, ...settings.customPricing };
                    }
                }
                
                setDynamicPackages(activeDynamicPackages);
                setDynamicEquipment(activeDynamicEquipment);
                setCustomPricing(activeCustomPrices);
                
                const processedBookings = parsedData.filter(b => b.id !== 'APP_SETTINGS').map(booking => {
                    if (booking.totalPrice === undefined && booking.status !== 'Batal') {
                        hasMissingPrices = true;
                        return { ...booking, totalPrice: calculateBookingPrice(booking, activeCustomPrices, activeDynamicPackages) };
                    }
                    return booking;
                });
                setBookings(processedBookings);

                if (hasMissingPrices) {
                    const dataToSave = [...processedBookings];
                    if (settings) dataToSave.push(settings);
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run.saveData(JSON.stringify(dataToSave));
                    } else {
                        localStorage.setItem('jadwalSewaKameraData', JSON.stringify(dataToSave));
                    }
                }
                setIsLoading(false);
                setIsRefreshing(false);
            };

            if (GOOGLE_SCRIPT_URL !== "URL_WEB_APP_ANDA_DISINI") {
                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL);
                    const data = await response.json();
                    processFetchedData(data || []);
                } catch (error) {
                    console.error("Gagal memuat data dari server, mencoba lokal:", error);
                    const savedData = localStorage.getItem('jadwalSewaKameraData');
                    if (savedData) { processFetchedData(JSON.parse(savedData)); } 
                    else { setIsLoading(false); setIsRefreshing(false); }
                }
            } else {
                // Mode Lokal / Belum setting URL
                const savedData = localStorage.getItem('jadwalSewaKameraData');
                if (savedData) { processFetchedData(JSON.parse(savedData)); } 
                else { setIsLoading(false); setIsRefreshing(false); }
            }
          };

          useEffect(() => { loadDataFromBackend(); }, []);

          const modifyData = async (action, payload) => {
            setIsSaving(true);
            let updatedBookings;

            if (action === 'ADD') updatedBookings = [...bookings, payload];
            else if (action === 'UPDATE') updatedBookings = bookings.map(b => b.id === payload.id ? payload : b);
            else if (action === 'DELETE') updatedBookings = bookings.filter(b => b.id !== payload);
            else if (action === 'SETTING_UPDATE') updatedBookings = [...bookings];
            else if (action === 'BULK_UPDATE') updatedBookings = payload.updatedBookings;

            setBookings(updatedBookings);
            
            let finalSettings = { 
                id: 'APP_SETTINGS', 
                totalMemoryCards: totalMemory, 
                isHolidayMode: isHolidayMode, 
                holidays: holidays, 
                customPricing: customPricing,
                dynamicPackages: dynamicPackages,
                dynamicEquipment: dynamicEquipment
            };
            
            if (action === 'SETTING_UPDATE') {
                if (payload.totalMemoryCards !== undefined) finalSettings.totalMemoryCards = payload.totalMemoryCards;
                if (payload.isHolidayMode !== undefined) finalSettings.isHolidayMode = payload.isHolidayMode;
                if (payload.holidays !== undefined) finalSettings.holidays = payload.holidays;
                if (payload.customPricing !== undefined) finalSettings.customPricing = payload.customPricing;
                if (payload.dynamicPackages !== undefined) finalSettings.dynamicPackages = payload.dynamicPackages;
                if (payload.dynamicEquipment !== undefined) finalSettings.dynamicEquipment = payload.dynamicEquipment;
            } else if (action === 'BULK_UPDATE' && payload.settings) {
                if (payload.settings.customPricing !== undefined) finalSettings.customPricing = payload.settings.customPricing;
                if (payload.settings.dynamicPackages !== undefined) finalSettings.dynamicPackages = payload.settings.dynamicPackages;
                if (payload.settings.dynamicEquipment !== undefined) finalSettings.dynamicEquipment = payload.settings.dynamicEquipment;
            }
            
            const dataToSave = [...updatedBookings, finalSettings];

            // Simpan ke local storage sebagai backup otomatis
            localStorage.setItem('jadwalSewaKameraData', JSON.stringify(dataToSave));

            if (GOOGLE_SCRIPT_URL !== "URL_WEB_APP_ANDA_DISINI") {
                try {
                    // Menggunakan text/plain untuk melewati pemblokiran CORS dari browser saat mengirim POST ke Google Apps Script
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(dataToSave),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    setIsSaving(false);
                } catch (error) {
                    console.error("Gagal simpan ke database:", error);
                    setError("Gagal menyimpan ke Server. Data disimpan secara lokal.");
                    setIsSaving(false);
                }
            } else {
                setIsSaving(false);
            }
          };

          const copyToClipboard = (text, type) => {
             const el = document.createElement('textarea');
             el.value = text;
             document.body.appendChild(el);
             el.select();
             document.execCommand('copy');
             document.body.removeChild(el);
             setCopyToast(`Berhasil disalin: ${text}`);
             setTimeout(() => setCopyToast(''), 3000);
          };

          const handleGeneratePDF = (booking) => {
              setIsGeneratingPDF(true);
              setPrintingBooking(booking);
              
              // Tunggu sejenak agar container tampil dan termuat
              setTimeout(async () => {
                  try {
                      const element = document.getElementById('pdf-nota-container');
                      
                      // Konversi HTML ke Gambar Canvas
                      const canvas = await window.html2canvas(element, { 
                          scale: 2, 
                          useCORS: true, 
                          allowTaint: true,
                          logging: false
                      });
                      
                      const imgData = canvas.toDataURL('image/png');
                      const { jsPDF } = window.jspdf;
                      
                      // Kertas A4 (Potrait, milimeter)
                      const pdf = new jsPDF('p', 'mm', 'a4');
                      const pdfWidth = pdf.internal.pageSize.getWidth();
                      const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                      
                      pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                      
                      // Proses Nama File
                      const safeName = booking.customerName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                      pdf.save(`NOTA_${booking.serviceType === 'fotografer' ? 'FOTO' : 'SEWA'}_${safeName}_${booking.id}.pdf`);
                      
                  } catch (error) {
                      console.error("Gagal membuat PDF:", error);
                      alert("Terjadi kesalahan saat memuat Nota PDF. Pastikan koneksi internet stabil.");
                  } finally {
                      setPrintingBooking(null);
                      setIsGeneratingPDF(false);
                  }
              }, 500);
          };

          const getOptionsWithFallback = (val) => {
              let opts = [...TIME_OPTIONS];
              if (val && !opts.includes(val)) { opts.push(val); opts.sort(); }
              return opts;
          };

          const checkHolidayConflict = (dateStr, timeStr) => {
              // --- KODE BARU: Kecualikan Admin dari pengecekan libur ---
              if (!isClient) return null; 
              // ---------------------------------------------------------
              if (!dateStr || !timeStr) return null;
              if (isHolidayMode && dateStr === todayDateStr) return "Toko sedang tutup darurat hari ini";
              
              const d = new Date(dateStr);
              const dayOfWeek = d.getDay().toString();
              for (let h of holidays) {
                  if (h.type === 'date' && h.date === dateStr) {
                      if (timeStr >= h.start && timeStr <= h.end) return h.note || "Toko Libur";
                  }
                  if (h.type === 'day' && h.day === dayOfWeek) {
                      if (timeStr >= h.start && timeStr <= h.end) return h.note || "Toko Libur Rutin";
                  }
              }
              return null;
          };

          const isTimeSelected = formData.startDate && formData.startTime && formData.endDate && formData.endTime;
          let timeError = "";

          if (isTimeSelected) {
            const startStr = formData.startTime;
            const endStr = formData.endTime;
            const start = new Date(`${formData.startDate}T${formData.startTime}`);
            const end = new Date(`${formData.endDate}T${formData.endTime}`);
            const realNow = new Date();
            const currentHour = realNow.getHours().toString().padStart(2, '0');
            const currentMin = realNow.getMinutes().toString().padStart(2, '0');
            const currentTimeStr = `${currentHour}:${currentMin}`;
            
            // Bekukan error masa lalu jika klien sudah di tahap konfirmasi/pembayaran agar harga tidak mereset
            if (isClient && (startStr < "05:00" || startStr > "22:00")) timeError = "Jam Ambil harus berada dalam jam operasional (05:00 - 22:00).";
            else if (isClient && !editingId && !clientDraftId && !showConfirmation && !showPayment && formData.startDate === todayDateStr && startStr <= currentTimeStr) timeError = "Waktu tidak boleh di masa lalu (jam sudah lewat).";
            else if (isClient && (endStr < "05:00" || endStr > "22:00")) timeError = "Jam Kembali harus berada dalam jam operasional (05:00 - 22:00).";
            else if (end <= start) timeError = "Waktu pengembalian harus setelah waktu pengambilan.";
            else {
                const startHoliday = checkHolidayConflict(formData.startDate, formData.startTime);
                if (startHoliday) timeError = `Waktu Ambil dilarang: ${startHoliday}.`;
                else {
                    const endHoliday = checkHolidayConflict(formData.endDate, formData.endTime);
                    if (endHoliday) timeError = `Waktu Kembali dilarang: ${endHoliday}.`;
                }
            }
          }

          // Perbaikan: rentalDurationHours dihitung tanpa terpengaruh timeError sesaat agar total Rp aman
          const rentalDurationHours = isTimeSelected ? 
            (new Date(`${formData.endDate}T${formData.endTime}`) - new Date(`${formData.startDate}T${formData.startTime}`)) / (1000 * 60 * 60) : 0;
            
          const hasCamera = formData.equipment.some(item => dynamicEquipment["Kamera"] && dynamicEquipment["Kamera"].includes(item));
          const has6D = formData.equipment.some(isCamera6D);
          const selectedPromoLenses = formData.equipment.filter(e => e.includes("Lensa Fix STM 50mm f1.8 Canon") || e.includes("Lensa Tele Canon 75-300mm USM"));

          const rawTotalCost = formData.equipment.reduce((sum, item) => {
              let price = getItemPrice(item, rentalDurationHours, hasCamera, customPricing, dynamicPackages);
              const isPromoLens = item.includes("Lensa Fix STM 50mm f1.8 Canon") || item.includes("Lensa Tele Canon 75-300mm USM");
              if (has6D && isPromoLens && selectedPromoLenses[0] === item) price = 0; 
              return sum + price;
          }, 0);
          
          const dynamicNamesList = dynamicPackages.map(p => `${p.category} - ${p.name}`);
          const isFotograferOnly = serviceType === 'fotografer' || (formData.equipment.some(item => dynamicNamesList.includes(item)) && !formData.equipment.some(item => !dynamicNamesList.includes(item)));
          
          const isThreeDaysOrMore = rentalDurationHours >= 72 && !isFotograferOnly;
          const autoDiscountAmount = isThreeDaysOrMore ? rawTotalCost * 0.10 : 0;
          const customDiscountAmount = Number(formData.discount || 0);
          const totalDiscountAmount = autoDiscountAmount + customDiscountAmount;
          const currentTotalCost = Math.max(0, rawTotalCost - totalDiscountAmount);

          const isCameraRented = formData.equipment.some(item => dynamicEquipment["Kamera"]?.includes(item));

          let availableMemory = totalMemory;
          let usedMemory = 0;
          let isMemoryEmpty = false;
          let availableBatteries = { ...BATTERY_LIMITS };

          if (isTimeSelected && !timeError && serviceType === 'kamera') {
            const newStart = new Date(`${formData.startDate}T${formData.startTime}`);
            const newEnd = new Date(`${formData.endDate}T${formData.endTime}`);
            
            const overlappingBookings = bookings.filter(booking => {
              if (editingId && booking.id === editingId) return false;
              if (clientDraftId && booking.id === clientDraftId) return false;
              if (booking.status === 'Selesai' || booking.status === 'Batal') return false;
              if (booking.serviceType === 'fotografer') return false;
              
              const existingStart = new Date(`${booking.startDate}T${booking.startTime}`);
              const existingEnd = new Date(`${booking.endDate}T${booking.endTime}`);
              return (newStart < existingEnd) && (newEnd > existingStart);
            });

            // --- Hitung Pemakaian Memori Kamera ---
            let events = [];
            overlappingBookings.forEach(booking => {
              const equips = Array.isArray(booking.equipment) ? booking.equipment : [booking.equipment];
              const camerasCount = equips.filter(e => EQUIPMENT_CATEGORIES["Kamera"].includes(e)).length;
              if (camerasCount > 0) {
                const bStart = new Date(`${booking.startDate}T${booking.startTime}`);
                const bEnd = new Date(`${booking.endDate}T${booking.endTime}`);
                events.push({ time: (bStart < newStart ? newStart : bStart).getTime(), type: 'start', memory: camerasCount });
                events.push({ time: (bEnd > newEnd ? newEnd : bEnd).getTime(), type: 'end', memory: camerasCount });
              }
            });

            events.sort((a, b) => {
                if (a.time === b.time) return a.type === 'end' ? -1 : 1;
                return a.time - b.time;
            });

            let currentMem = 0;
            let maxMem = 0;
            events.forEach(ev => {
                if (ev.type === 'start') currentMem += ev.memory;
                else currentMem -= ev.memory;
                if (currentMem > maxMem) maxMem = currentMem;
            });

            usedMemory = maxMem;
            availableMemory = Math.max(0, totalMemory - usedMemory);
            isMemoryEmpty = availableMemory <= 0;
            
            // --- Hitung Pemakaian Inventaris Baterai ---
            let batteryEvents = { "BAT_600D": [], "BAT_1200D": [], "BAT_6D": [], "BAT_NIKON": [] };
            
            overlappingBookings.forEach(booking => {
                const equips = Array.isArray(booking.equipment) ? booking.equipment : [booking.equipment];
                let counts = { "BAT_600D": 0, "BAT_1200D": 0, "BAT_6D": 0, "BAT_NIKON": 0 };
                
                equips.forEach(item => {
                    if (CAMERA_BATTERY_MAP[item]) counts[CAMERA_BATTERY_MAP[item]] += 1;
                    // Jika ada kamera 6D yang namanya sudah diubah
                    if (isCamera6D(item) && !CAMERA_BATTERY_MAP[item]) counts["BAT_6D"] += 1;
                    
                    if (item === "+BATERAI NIKON") counts["BAT_NIKON"] += 1;
                    if (item === "+BATERAI CANON") {
                        // Baterai tambahan canon mengikuti jenis kamera canon yang disewa
                        const canonCam = equips.find(e => CAMERA_BATTERY_MAP[e] && CAMERA_BATTERY_MAP[e] !== "BAT_NIKON");
                        if (canonCam) counts[CAMERA_BATTERY_MAP[canonCam]] += 1;
                        else counts["BAT_1200D"] += 1; // Fallback pool terbanyak jika tidak bawa kamera
                    }
                });
                
                const bStart = new Date(`${booking.startDate}T${booking.startTime}`);
                const bEnd = new Date(`${booking.endDate}T${booking.endTime}`);
                const evStart = (bStart < newStart ? newStart : bStart).getTime();
                const evEnd = (bEnd > newEnd ? newEnd : bEnd).getTime();
                
                for (let type in counts) {
                    if (counts[type] > 0) {
                        batteryEvents[type].push({ time: evStart, type: 'start', val: counts[type] });
                        batteryEvents[type].push({ time: evEnd, type: 'end', val: counts[type] });
                    }
                }
            });
            
            for (let type in batteryEvents) {
                let evts = batteryEvents[type];
                evts.sort((a, b) => a.time === b.time ? (a.type === 'end' ? -1 : 1) : a.time - b.time);
                let current = 0, max = 0;
                evts.forEach(ev => {
                    if (ev.type === 'start') current += ev.val;
                    else current -= ev.val;
                    if (current > max) max = current;
                });
                availableBatteries[type] -= max;
            }
          }

          const getRecommendedTimes = () => {
            if (!formData.startDate) return [];
            const targetDate = formData.startDate;
            const activeOnDate = bookings.filter(b => {
                if (b.status === 'Selesai' || b.status === 'Batal' || b.serviceType === 'fotografer') return false; 
                if (editingId && b.id === editingId) return false;
                const equips = Array.isArray(b.equipment) ? b.equipment : [b.equipment];
                const hasCam = equips.some(e => EQUIPMENT_CATEGORIES["Kamera"].includes(e));
                if (!hasCam) return false;
                const bStart = new Date(`${b.startDate}T${b.startTime}`);
                const bEnd = new Date(`${b.endDate}T${b.endTime}`);
                const dStart = new Date(`${targetDate}T00:00`);
                const dEnd = new Date(`${targetDate}T23:59`);
                return bStart <= dEnd && bEnd >= dStart;
            });

            let recommendations = [];
            activeOnDate.forEach(b => { if (b.endDate === targetDate) recommendations.push(b.endTime); });
            return [...new Set(recommendations)].sort();
          };

          const getEquipmentAvailability = () => {
            if (!isTimeSelected || timeError) return {};
            const newStart = new Date(`${formData.startDate}T${formData.startTime}`);
            const newEnd = new Date(`${formData.endDate}T${formData.endTime}`);
            const equipmentStatus = {};

            for (const [category, items] of Object.entries(dynamicEquipment)) {
              equipmentStatus[category] = items.map(item => {
                const hasConflict = bookings.some(booking => {
                  if (editingId && booking.id === editingId) return false;
                  if (clientDraftId && booking.id === clientDraftId) return false;
                  if (booking.status === 'Selesai' || booking.status === 'Batal') return false;
                  
                  // JIKA booking memiliki paymentStatus 'BELUM BAYAR' dan status 'Booking' (biasanya dari BAYAR DI TEMPAT Klien)
                  // Maka anggap TIDAK CONFLICT, agar orang lain tetap bisa booking barang tersebut.
                  if (booking.paymentStatus === 'BELUM BAYAR' && booking.status === 'Booking') return false;

                  const isItemRented = Array.isArray(booking.equipment) ? booking.equipment.includes(item) : booking.equipment === item;
                  if (!isItemRented) return false;
                  const existingStart = new Date(`${booking.startDate}T${booking.startTime}`);
                  const existingEnd = new Date(`${booking.endDate}T${booking.endTime}`);
                  return (newStart < existingEnd) && (newEnd > existingStart);
                });
                
                let available = !hasConflict;
                let reason = hasConflict ? 'Dipinjam Orang Lain' : '';

                if (category === "Kamera" && !hasConflict) {
                    if (isMemoryEmpty) { available = false; reason = 'Memori Habis'; }
                    else if (CAMERA_BATTERY_MAP[item] && availableBatteries[CAMERA_BATTERY_MAP[item]] <= 0) {
                        available = false; reason = 'Baterai Habis';
                    }
                }
                
                if (item === "+BATERAI NIKON" && !hasConflict && availableBatteries["BAT_NIKON"] <= 0) {
                    available = false; reason = 'Baterai Habis';
                }
                
                if (item === "+BATERAI CANON" && !hasConflict) {
                    const anyCanonAvail = availableBatteries["BAT_600D"] > 0 || availableBatteries["BAT_1200D"] > 0 || availableBatteries["BAT_6D"] > 0;
                    if (!anyCanonAvail) { available = false; reason = 'Baterai Habis'; }
                }

                return { name: item, available: available, reason: reason };
              });
            }
            return equipmentStatus;
          };

          const equipmentAvailability = getEquipmentAvailability();
          const isItemAvailable = (itemName) => {
              for (const cat in equipmentAvailability) {
                  const found = equipmentAvailability[cat].find(eq => eq.name === itemName);
                  if (found) return found.available;
              }
              return false;
          };

          useEffect(() => {
            // JANGAN hapus isi keranjang jika klien sedang di tahap konfirmasi/pembayaran atau draft
            if (showConfirmation || showPayment || clientDraftId) return;

            if (serviceType === 'kamera' && formData.equipment.length > 0 && isTimeSelected && !timeError) {
              const currentEqStatus = getEquipmentAvailability();
              const availableFlatList = Object.values(currentEqStatus).flat().filter(eq => eq.available).map(eq => eq.name);

              let validSelectedItems = formData.equipment.filter(item => availableFlatList.includes(item));
              const cameras = validSelectedItems.filter(e => dynamicEquipment["Kamera"]?.includes(e));
              
              if (cameras.length > availableMemory) {
                 const allowedCameras = cameras.slice(0, availableMemory);
                 const nonCameras = validSelectedItems.filter(e => !dynamicEquipment["Kamera"]?.includes(e));
                 validSelectedItems = [...allowedCameras, ...nonCameras];
                 setError(`Beberapa kamera otomatis dihapus karena slot memori terbatas.`);
              }

              if (validSelectedItems.length !== formData.equipment.length) {
                setFormData(prev => ({ ...prev, equipment: validSelectedItems }));
              }
            } else if (serviceType === 'kamera' && (!isTimeSelected || timeError)) {
              setFormData(prev => ({ ...prev, equipment: [] }));
            }
          }, [formData.startDate, formData.startTime, formData.endDate, formData.endTime, bookings, availableMemory, serviceType]);

          const handleChange = (e) => {
            setFormData({ ...formData, [e.target.name]: e.target.value });
            setError(''); setSuccess('');
          };

          const handleEquipmentToggle = (item) => {
            if (serviceType === 'fotografer') {
                setFormData(prev => ({ ...prev, equipment: [item] }));
                setError('');
                return;
            }

            setFormData(prev => {
              const currentEquip = prev.equipment;
              const isCamera = dynamicEquipment["Kamera"]?.includes(item);
              const isCurrentlySelected = currentEquip.includes(item);
              
              if (!isCurrentlySelected && isCamera) {
                const selectedCamerasCount = currentEquip.filter(e => EQUIPMENT_CATEGORIES["Kamera"].includes(e)).length;
                if (selectedCamerasCount >= availableMemory) {
                   setError(`Gagal: Maksimal kamera yang bisa disewa saat ini adalah ${availableMemory} (Memori Terbatas).`);
                   return prev;
                }
              }

              if (!isCurrentlySelected && isCamera6D(item)) {
                  // Mencari nama asli lensa yang terdaftar di dynamicEquipment
                  const allLenses = dynamicEquipment["Lensa"] || [];
                  const fixLensName = allLenses.find(l => l.includes("Lensa Fix STM 50mm f1.8 Canon")) || "Lensa Fix STM 50mm f1.8 Canon";
                  const teleLensName = allLenses.find(l => l.includes("Lensa Tele Canon 75-300mm USM")) || "Lensa Tele Canon 75-300mm USM";
                  
                  const fixAvailable = isItemAvailable(fixLensName);
                  const teleAvailable = isItemAvailable(teleLensName);
                  
                  if (!fixAvailable && !teleAvailable) {
                      setError("Gagal: Semua stok Lensa Fix dan Tele sedang kosong. Canon EOS 6D tidak dapat disewa tanpa lensa bawaan.");
                      return prev;
                  }

                  const hasFix = currentEquip.includes(fixLensName);
                  const hasTele = currentEquip.includes(teleLensName);
                  
                  let newEquip = [...currentEquip, item];
                  if (!hasFix && !hasTele) {
                      if (fixAvailable) newEquip.push(fixLensName);
                      else newEquip.push(teleLensName);
                  }
                  setError('');
                  return { ...prev, equipment: newEquip };
              }

              setError('');
              if (isCurrentlySelected) return { ...prev, equipment: currentEquip.filter(e => e !== item) };
              else return { ...prev, equipment: [...currentEquip, item] };
            });
          };

          const handleSubmit = (e) => {
            if(e && e.preventDefault) e.preventDefault();
            setError(''); setSuccess('');

            if (!isTimeSelected || timeError) {
                setError('Silakan tentukan Waktu dengan benar terlebih dahulu.');
                window.scrollTo({ top: document.getElementById('step-1').offsetTop - 20, behavior: 'smooth' });
                return;
            }

          const handleSaveDynamicPackage = (e) => {

              };

                    {[...filteredDisplayedBookings].sort((a, b) => {

                      const dateB = new Date(`${b.startDate}T${b.startTime || '00:00'}`);
                      return dateA - dateB; 
                    }).map((booking) => {
                      const isExpanded = expandedIds.includes(booking.id);
                      const calStart = formatCalendarDisplay(booking.startDate);

                      let countdownUI = null;
                      if (booking.status === 'Booking' && booking.startDate && booking.startTime) {
                          const target = new Date(`${booking.startDate}T${booking.startTime}`);
                          const diffMs = target - currentTime;
                          const isNegative = diffMs < 0;
                          const absDiff = Math.abs(diffMs);
                          const days = Math.floor(absDiff / (1000 * 60 * 60 * 24));
                          const hours = Math.floor((absDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                          const minutes = Math.floor((absDiff % (1000 * 60 * 60)) / (1000 * 60));

                          let timeParts = [];

                      } else if (booking.status === 'Diambil' && booking.endDate && booking.endTime && booking.startDate && booking.startTime) {

                          const bookingDuration = (originalTarget.getTime() - startTarget.getTime()) / (1000 * 60 * 60);
                          
                          let gracePeriodMs = 0;
                          let graceLabel = "";
                          
                          if (bookingDuration >= 23.5) { gracePeriodMs = 60 * 60 * 1000; graceLabel = "+1 Jam"; } 
                          else if (bookingDuration >= 11.5) { gracePeriodMs = 30 * 60 * 1000; graceLabel = "+30 Mnt"; }
                          
                          const finalTarget = new Date(originalTarget.getTime() + gracePeriodMs);
                          const diffMs = finalTarget.getTime() - currentTime.getTime();
                          const isNegative = diffMs < 0; 
                          const isInGracePeriod = !isNegative && (originalTarget.getTime() - currentTime.getTime() < 0);
                          
                          const absDiff = Math.abs(diffMs);
                          const days = Math.floor(absDiff / (1000 * 60 * 60 * 24));
                          const hours = Math.floor((absDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                          const minutes = Math.floor((absDiff % (1000 * 60 * 60)) / (1000 * 60));
                          const seconds = Math.floor((absDiff % (1000 * 60)) / 1000);
                          
                          let timeParts = [];
                          if (days > 0) timeParts.push(`${days} H`);
                          if (hours > 0) timeParts.push(`${hours} J`);

                          } else if (isInGracePeriod) {

                          } else {
                              const originalDiffMs = originalTarget.getTime() - currentTime.getTime();
                              const oDays = Math.floor(originalDiffMs / (1000 * 60 * 60 * 24));
                              const oHours = Math.floor((originalDiffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                              const oMinutes = Math.floor((originalDiffMs % (1000 * 60 * 60)) / (1000 * 60));
                              const oSeconds = Math.floor((originalDiffMs % (1000 * 60)) / 1000);
                              let oTimeParts = [];
                              if (oDays > 0) oTimeParts.push(`${oDays} H`);
                              if (oHours > 0) oTimeParts.push(`${oHours} J`);
                              oTimeParts.push(`${oMinutes} M`);
                              oTimeParts.push(`${oSeconds} D`);
                              countdownUI = { text: `Sisa: ${oTimeParts.join(' ')}`, style: 'text-sky-300 bg-sky-900/20 border-sky-800/30 font-semibold', icon: '⏰' };

                      <button onClick={() => setEditPriceModal(null)} className="flex-1 px-4 py-3.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold transition-all border border-slate-600 active:scale-95 text-[16px] sm:text-sm uppercase tracking-wider">Batal</button>
                      <button onClick={() => {
                        const finalPrice = parseInt(editPriceModal.newPrice, 10) || 0;
                        const { newPrice, ...bookingDataToUpdate } = editPriceModal;
                        modifyData('UPDATE', { ...bookingDataToUpdate, totalPrice: finalPrice });
                        setEditPriceModal(null); setSuccess('Harga khusus berhasil disimpan!'); setTimeout(() => setSuccess(''), 3000); window.scrollTo({ top: 0, behavior: 'smooth' });
                      }} className="flex-[2] px-4 py-3.5 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white rounded-xl font-black transition-all shadow-[0_4px_15px_rgba(16,185,129,0.3)] active:scale-95 text-[16px] sm:text-sm uppercase tracking-widest">Terapkan</button>
                    </div>
                  </div>
                </div>
              )}

              {}
              {showHolidayModal && !isClient && (
                <div className="fixed inset-0 z-[80] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/80 backdrop-blur-md transition-opacity">
                  <div className="bg-slate-900 border-t sm:border border-slate-700 rounded-t-[2rem] sm:rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col animate-slideUp pb-safe">
                    <div className="w-12 h-1.5 bg-slate-700 rounded-full mx-auto my-3 sm:hidden shrink-0"></div>
                    <div className="px-5 sm:px-6 pb-4 border-b border-slate-800 flex justify-between items-center shrink-0">
                      <h3 className="text-xl sm:text-2xl font-extrabold text-white flex items-center gap-2"><span>🏖️</span> Jadwal Libur Sistem</h3>
                      <button onClick={() => setShowHolidayModal(false)} className="text-slate-500 hover:text-white bg-slate-800 rounded-full p-1.5 transition-colors"><svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
                    </div>
                    <div className="p-5 sm:p-6 overflow-y-auto custom-scrollbar flex-1 space-y-6">
                      <div>
                         <h4 className="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-3 border-b border-slate-800 pb-2">Daftar Jadwal Libur Aktif</h4>

                             <div className="text-center p-6 bg-slate-800/30 rounded-2xl border border-slate-700/50 text-slate-500 font-bold text-sm">Belum ada jadwal libur yang diatur.</div>
                         ) : (
                             <div className="space-y-3">
                                 {holidays.map(h => (
                                     <div key={h.id} className="flex justify-between items-center bg-slate-800/60 p-4 rounded-xl border border-slate-700">
                                         <div>
                                             <div className="flex items-center gap-2 mb-1">
                                                <span className={`text-[9px] px-2 py-0.5 rounded font-black uppercase tracking-widest ${h.type === 'date' ? 'bg-sky-500/20 text-sky-400' : 'bg-violet-500/20 text-violet-400'}`}>{h.type === 'date' ? 'Tanggal' : 'Hari Rutin'}</span>
                                                <span className="font-bold text-slate-200 text-sm">{h.type === 'date' ? formatDateDisplay(h.date).formattedDate : ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][parseInt(h.day)]}</span>
                                             </div>
                                             <div className="text-xs text-slate-400 font-medium mt-1">⏰ {h.start} - {h.end} WIB <span className="mx-1 text-slate-600">|</span> 📝 {h.note || '-'}</div>
                                         </div>
                                         <div className="flex gap-2">
                                             <button onClick={() => setHolidayForm(h)} className="bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 p-2 rounded-lg transition-colors" title="Edit">✏️</button>
                                             <button onClick={() => { const newHolidays = holidays.filter(item => item.id !== h.id); setHolidays(newHolidays); modifyData('SETTING_UPDATE', { holidays: newHolidays }); }} className="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 p-2 rounded-lg transition-colors" title="Hapus">🗑️</button>
                                         </div>
                                     </div>
                                 ))}
                             </div>
                         )}
                      </div>
                      <div className="bg-slate-950/50 p-5 rounded-2xl border border-slate-800">
                         <div className="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                             <h4 className="text-[11px] font-black text-emerald-400 uppercase tracking-widest flex items-center gap-2"><span>{holidayForm.id ? '✏️' : '➕'}</span> {holidayForm.id ? 'Edit Jadwal Libur' : 'Tambah Jadwal Libur'}</h4>
                             {holidayForm.id && <button onClick={() => setHolidayForm({ type: 'date', date: '', day: '0', start: '00:00', end: '23:59', note: '' })} className="text-[10px] font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-600 transition-colors">Batal Edit</button>}
                         </div>
                         <div className="space-y-4">
                            <div className="flex gap-4">
                                <label className={`flex-1 flex justify-center items-center gap-2 p-3 rounded-xl border cursor-pointer font-bold text-sm transition-colors ${holidayForm.type === 'date' ? 'bg-sky-500/20 border-sky-500/50 text-sky-400' : 'bg-slate-900 border-slate-700 text-slate-400'}`}>
                                    <input type="radio" name="hType" className="hidden" checked={holidayForm.type === 'date'} onChange={() => setHolidayForm({...holidayForm, type: 'date'})}/>📅 Tanggal Spesifik
                                </label>
                                <label className={`flex-1 flex justify-center items-center gap-2 p-3 rounded-xl border cursor-pointer font-bold text-sm transition-colors ${holidayForm.type === 'day' ? 'bg-violet-500/20 border-violet-500/50 text-violet-400' : 'bg-slate-900 border-slate-700 text-slate-400'}`}>
                                    <input type="radio" name="hType" className="hidden" checked={holidayForm.type === 'day'} onChange={() => setHolidayForm({...holidayForm, type: 'day'})}/>🔄 Hari Rutin
                                </label>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                {holidayForm.type === 'date' ? (
                                    <div className="col-span-2">
                                        <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 pl-1">Pilih Tanggal</label>
                                        <input type="date" value={holidayForm.date} onChange={(e) => setHolidayForm({...holidayForm, date: e.target.value})} className="w-full bg-slate-800 text-white font-bold p-3 rounded-xl border border-slate-600 focus:ring-2 focus:ring-emerald-500 outline-none [color-scheme:dark]" />
                                    </div>
                                ) : (
                                    <div className="col-span-2">
                                        <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 pl-1">Pilih Hari</label>
                                        <select value={holidayForm.day} onChange={(e) => setHolidayForm({...holidayForm, day: e.target.value})} className="w-full bg-slate-800 text-white font-bold p-3 rounded-xl border border-slate-600 focus:ring-2 focus:ring-emerald-500 outline-none appearance-none cursor-pointer">
                                            <option value="1">Senin</option><option value="2">Selasa</option><option value="3">Rabu</option><option value="4">Kamis</option><option value="5">Jumat</option><option value="6">Sabtu</option><option value="0">Minggu</option>
                                        </select>
                                    </div>
                                )}
                                <div>
                                    <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 pl-1">Jam Mulai</label>
                                    <input type="time" value={holidayForm.start} onChange={(e) => setHolidayForm({...holidayForm, start: e.target.value})} className="w-full bg-slate-800 text-white font-bold p-3 rounded-xl border border-slate-600 focus:ring-2 focus:ring-emerald-500 outline-none [color-scheme:dark]" />
                                </div>
                                <div>
                                    <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 pl-1">Jam Selesai</label>
                                    <input type="time" value={holidayForm.end} onChange={(e) => setHolidayForm({...holidayForm, end: e.target.value})} className="w-full bg-slate-800 text-white font-bold p-3 rounded-xl border border-slate-600 focus:ring-2 focus:ring-emerald-500 outline-none [color-scheme:dark]" />
                                </div>
                                <div className="col-span-2">
                                    <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 pl-1">Keterangan / Alasan (Muncul ke user)</label>
                                    <input type="text" placeholder="Cth: Libur Idul Fitri / Tutup Awal" value={holidayForm.note} onChange={(e) => setHolidayForm({...holidayForm, note: e.target.value})} className="w-full bg-slate-800 text-white font-bold p-3 rounded-xl border border-slate-600 focus:ring-2 focus:ring-emerald-500 outline-none placeholder-slate-500" />
                                </div>
                            </div>
                            <button onClick={() => {
                                if (holidayForm.type === 'date' && !holidayForm.date) return alert("Pilih tanggal terlebih dahulu");
                                if (!holidayForm.start || !holidayForm.end) return alert("Tentukan jam mulai dan jam selesai");
                                
                                let newHolidays;
                                if (holidayForm.id) {
                                    newHolidays = holidays.map(h => h.id === holidayForm.id ? holidayForm : h);
                                } else {
                                    newHolidays = [...holidays, { ...holidayForm, id: Date.now().toString() }];
                                }
                                
                                setHolidays(newHolidays); modifyData('SETTING_UPDATE', { holidays: newHolidays });
                                setHolidayForm({ type: 'date', date: '', day: '0', start: '00:00', end: '23:59', note: '' });
                            }} className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl uppercase tracking-widest text-sm transition-all shadow-md mt-2">{holidayForm.id ? 'Simpan Perubahan' : 'Simpan Jadwal Baru'}</button>
                         </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {showPriceSettings && !isClient && (
                <div className="fixed inset-0 z-[80] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/80 backdrop-blur-md transition-opacity">
                  <div className="bg-slate-900 border-t sm:border border-slate-700 rounded-t-[2rem] sm:rounded-3xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col animate-slideUp pb-safe">
                    <div className="w-12 h-1.5 bg-slate-700 rounded-full mx-auto my-3 sm:hidden shrink-0"></div>
                    <div className="px-5 sm:px-6 pb-4 border-b border-slate-800 flex justify-between items-center shrink-0">
                      <h3 className="text-xl sm:text-2xl font-extrabold text-white flex items-center gap-2"><span>⚙️</span> Editor Harga Alat</h3>
                      <button onClick={() => setShowPriceSettings(false)} className="text-slate-500 hover:text-white bg-slate-800 rounded-full p-1.5 transition-colors"><svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
                    </div>
                    
                    <div className="p-5 sm:p-6 overflow-y-auto custom-scrollbar flex-1 space-y-8 bg-slate-950/30">
                       <div className="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-2xl flex gap-3 shadow-inner">
                           <span className="text-xl mt-0.5">💡</span>
                           <p className="text-emerald-100/80 text-[11px] sm:text-xs font-medium leading-relaxed">
                               Ubah harga sewa alat di bawah ini. Untuk mengubah Harga Paket Jasa Fotografer, silakan gunakan fitur Edit di menu Katalog. Anda juga dapat menambah alat baru atau menghapus alat yang sudah tidak disewakan.
                           </p>
                       </div>

                       <div>
                           <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-700 pb-2 mb-4 gap-3">
                               <h4 className="text-sm font-black text-emerald-400 uppercase tracking-widest">Sewa Alat (Kamera, Lensa, Aksesoris)</h4>
                               <button onClick={() => setAddEquipmentModal({})} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition-colors flex items-center gap-1.5">
                                   <span>➕</span> Tambah Alat
                               </button>
                           </div>
                           <div className="space-y-6">
                               {Object.entries(dynamicEquipment).map(([category, items]) => (
                                   <div key={category} className="space-y-4">
                                       <h5 className="text-[11px] font-black text-slate-400 uppercase tracking-widest pl-2">{category}</h5>
                                       {items.map(item => (
                                           <div key={item} className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 relative group overflow-hidden">
                                               <div className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex gap-1.5 z-10">
                                                   <button onClick={(e) => { e.preventDefault(); handleDeleteEquipment(category, item); }} className="bg-rose-500/90 hover:bg-rose-400 text-white p-2 rounded-lg shadow-md transition-all active:scale-95" title="Hapus Alat">🗑️</button>
                                               </div>
                                               <span className="block font-bold text-slate-200 mb-3 text-[15px] sm:text-sm pr-16">{item}</span>
                                               <div className="grid grid-cols-4 gap-2 relative z-0">
                                                   {[4, 6, 12, 24].map(hours => (
                                                       <div key={hours}>
                                                           <label className="block text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">{hours} Jam (Rp)</label>
                                                           <input type="number" 
                                                               value={priceForm[item]?.[hours] !== undefined ? priceForm[item][hours] : (customPricing[item]?.[hours] || DEFAULT_PRICING[item]?.[hours] || 0)}
                                                               onChange={(e) => {
                                                                   const val = parseInt(e.target.value) || 0;
                                                                   const currentPrices = priceForm[item] || customPricing[item] || DEFAULT_PRICING[item] || { 4:0, 6:0, 12:0, 24:0 };
                                                                   setPriceForm(prev => ({ ...prev, [item]: { ...currentPrices, [hours]: val } }));
                                                               }}
                                                               className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-white text-xs font-bold focus:ring-1 focus:ring-emerald-500 outline-none text-center"
                                                           />
                                                       </div>
                                                   ))}
                                               </div>
                                           </div>
                                       ))}
                                   </div>
                               ))}
                           </div>
                       </div>
                    </div>

                    <div className="p-5 sm:p-6 border-t border-slate-800 flex gap-3 shrink-0">
                      <button onClick={() => setShowPriceSettings(false)} className="px-4 py-3.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold transition-all border border-slate-600 active:scale-95">Batal</button>
                      <button onClick={() => {
                          setCustomPricing(priceForm);
                          modifyData('SETTING_UPDATE', { customPricing: priceForm });
                          setShowPriceSettings(false);
                          setSuccess('Harga Sistem Berhasil Diperbarui!');
                          setTimeout(() => setSuccess(''), 3000);
                      }} className="flex-1 px-4 py-3.5 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white rounded-xl font-black transition-all shadow-[0_4px_15px_rgba(16,185,129,0.3)] active:scale-95 text-[16px] sm:text-sm uppercase tracking-widest">Simpan Semua Harga Alat</button>
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL EDIT NAMA ALAT (RENAME) - REMOVED */}

              {/* MODAL TAMBAH ALAT BARU */}
              {addEquipmentModal && !isClient && (
                  <div className="fixed inset-0 z-[90] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/90 backdrop-blur-sm transition-opacity">
                      <div className="bg-slate-900 border-t sm:border border-slate-700 rounded-t-[2rem] sm:rounded-3xl shadow-2xl max-w-md w-full max-h-[90vh] flex flex-col animate-slideUp pb-safe">
                          <div className="px-5 sm:px-6 py-4 border-b border-slate-800 flex justify-between items-center shrink-0">
                              <h3 className="text-xl font-extrabold text-white flex items-center gap-2">
                                  <span>➕</span> Tambah Alat Baru
                              </h3>
                              <button onClick={() => setAddEquipmentModal(null)} className="text-slate-500 hover:text-white bg-slate-800 rounded-full p-1.5 transition-colors"><svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
                          </div>
                          
                          <form onSubmit={handleAddEquipment} className="p-5 sm:p-6 overflow-y-auto custom-scrollbar flex-1 space-y-4">
                              <div>
                                  <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 pl-1">Kategori Alat</label>
                                  <div className="relative">
                                      <select name="category" required className="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl focus:ring-2 focus:ring-emerald-500 text-sm text-white font-bold outline-none appearance-none">
                                          <option value="Kamera">Kamera</option>
                                          <option value="Lensa">Lensa</option>
                                          <option value="Aksesoris">Aksesoris</option>
                                      </select>
                                      <div className="pointer-events-none absolute inset-y-0 right-4 flex items-center text-emerald-500">▼</div>
                                  </div>
                              </div>
                              <div>
                                  <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 pl-1">Nama Alat</label>
                                  <input type="text" name="name" required placeholder="Contoh: Sony A7III" className="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl focus:ring-2 focus:ring-emerald-500 text-sm text-white outline-none" />
                                  <p className="text-[10px] text-amber-400 font-bold mt-1 pl-1 flex gap-1"><span>⚠️</span> Nama harus unik dan tidak boleh sama dengan alat yang sudah ada.</p>
                              </div>
                              
                              <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-2 space-y-3">
                                  <span className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 border-b border-slate-700/50 pb-2">Pengaturan Harga Sewa</span>
                                  <div className="grid grid-cols-2 gap-3">
                                      <div>
                                          <label className="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">4 Jam (Rp)</label>
                                          <input type="number" name="p4" required placeholder="0" className="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-emerald-500 text-xs font-bold text-white outline-none text-right" />
                                      </div>
                                      <div>
                                          <label className="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">6 Jam (Rp)</label>
                                          <input type="number" name="p6" required placeholder="0" className="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-emerald-500 text-xs font-bold text-white outline-none text-right" />
                                      </div>
                                      <div>
                                          <label className="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">12 Jam (Rp)</label>
                                          <input type="number" name="p12" required placeholder="0" className="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-emerald-500 text-xs font-bold text-white outline-none text-right" />
                                      </div>
                                      <div>
                                          <label className="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">24 Jam (Rp)</label>
                                          <input type="number" name="p24" required placeholder="0" className="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-emerald-500 text-xs font-bold text-white outline-none text-right" />
                                      </div>
                                  </div>
                              </div>

                              <button type="submit" className="w-full py-4 mt-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-black uppercase tracking-widest text-sm shadow-md transition-colors flex items-center justify-center gap-2">
                                  <span>💾</span> Simpan Alat Baru
                              </button>
                          </form>
                      </div>
                  </div>
              )}
              
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
